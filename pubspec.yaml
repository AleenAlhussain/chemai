name: chemai_2
description: CHEMAI — Quantum Simulation Chemistry Learning Engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.2.3

  # Images
  cached_network_image: ^3.3.1

  # UI
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0

  # Typography
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
